syntax = "proto3";
package bilibili.community.service.dm.v1;
option java_package = "com.biliclient.danmaku.proto";

// 仅保留弹幕解析所需的两个消息（DmSegMobileReply -> DanmakuElem），
// 字段编号取自 bili23 misc/dm_pb2.py 的序列化描述符（doc 06）。
message DanmakuElem {
  int64  id        = 1;
  int32  stime     = 2;   // 出现时间(毫秒，相对视频起点)
  int32  mode      = 3;   // 1-3 滚动, 4 底部, 5 顶部, 6 逆向, 7 高级, 8 代码, 9 BAS
  int32  size      = 4;   // 字号: 25 标准, 18 小
  uint32 color     = 5;   // 十进制 RGB
  string uhash     = 6;
  string text      = 7;   // 弹幕内容
  int64  date      = 8;
  int32  weight    = 9;
  string action    = 10;
  int32  pool      = 11;
  string dmid      = 12;
  int32  attr      = 13;
  string animation = 22;
  int32  colorful  = 24;
  int64  oid       = 26;
  int32  dmFrom    = 27;
}

message DmSegMobileReply {
  repeated DanmakuElem elems = 1;
  int32 state = 2;
}
