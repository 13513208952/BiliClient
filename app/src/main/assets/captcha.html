<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>验证</title>
    <!-- 极验 v3 加载器（来自极验官方静态资源；登录交互所需，非应用运行资源，非 GMS） -->
    <script src="https://static.geetest.com/static/tools/gt.js"></script>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; background: transparent; }
        #wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        #tip { font-family: sans-serif; color: #888; font-size: 14px; }
    </style>
</head>
<body>
<div id="wrap"><div id="captcha"><span id="tip">正在加载验证…</span></div></div>
<script>
    function postResult(validate, seccode) {
        if (window.AndroidBridge && AndroidBridge.onSuccess) {
            AndroidBridge.onSuccess(validate, seccode);
        }
    }
    function postError(msg) {
        if (window.AndroidBridge && AndroidBridge.onError) {
            AndroidBridge.onError(String(msg));
        }
    }
    // Kotlin 端调用：startGeetest(gt, challenge)
    function startGeetest(gt, challenge) {
        try {
            if (typeof initGeetest !== 'function') { postError('gt.js 未加载'); return; }
            initGeetest({
                gt: gt,
                challenge: challenge,
                offline: false,
                new_captcha: true,
                product: 'popup',
                width: '300px',
                lang: 'zh-cn'
            }, function (captchaObj) {
                captchaObj.appendTo('#captcha');
                captchaObj.onReady(function () {
                    document.getElementById('tip').style.display = 'none';
                    captchaObj.verify();
                });
                captchaObj.onSuccess(function () {
                    var r = captchaObj.getValidate();
                    if (r && r.geetest_validate) {
                        postResult(r.geetest_validate, r.geetest_seccode);
                    } else {
                        postError('验证结果为空');
                    }
                });
                captchaObj.onError(function (e) { postError((e && e.msg) || 'geetest error'); });
            });
        } catch (e) { postError(e && e.message ? e.message : e); }
    }
</script>
</body>
</html>
